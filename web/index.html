<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>code viewer</title>
<link rel="icon" type="image/png" href="/favicon.png" />

<!-- diff2html/highlight.js assets are vendored so the preview works offline
     and does not make network requests from the browser. The highlighter JS is
     loaded on demand from the toolbar. -->
<link rel="stylesheet" href="/vendor/diff2html/diff2html.min.css" />
<link rel="stylesheet" href="/vendor/highlight.js/styles/github.min.css" id="hljs-light" />
<link rel="stylesheet" href="/vendor/highlight.js/styles/github-dark.min.css" id="hljs-dark" disabled />
<!-- xterm 本体 (web/xterm.js) は terminal ドロワーを開くまで読み込まないが、
     スタイルは 7KB 程度なので他の vendor CSS と同じくここで読む。 -->
<link rel="stylesheet" href="/vendor/xterm/xterm.css" />
<script src="/vendor/diff2html/diff2html-ui.min.js"></script>

<!-- 前回の骨格の見た目 (テーマ・左のサイドバー) を CSS より先に当てる。
     控えを書くのは web-src/views/shell/early-look.ts (キーと形はそちらと同じ)。
     控えが無い・読めないときは既定 (ダーク・開いたサイドバー) のまま描く。 -->
<script>
(function () {
  var raw = window.localStorage.getItem("code-viewer:early-look");
  if (!raw) return;
  var look = JSON.parse(raw);
  var root = document.documentElement;
  if (look.theme === "light" || look.theme === "dark") root.dataset.theme = look.theme;
  if (look.palette) root.dataset.palette = look.palette;
  if (look.navCollapsed) root.dataset.navCollapsed = "";
  if (look.navWidth > 0) root.style.setProperty("--nav-w", look.navWidth + "px");
})();
</script>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app">
  <!-- 左のサイドバー: 検索の入口・プロジェクトとエージェントの一覧・
       新しいエージェント / 設定 / ヘルプ。一覧の中身は
       views/agents/agents-sidebar.ts、畳む・幅は views/shell/app-nav.ts。 -->
  <aside id="app-nav" aria-label="Projects and agents">
    <div class="nav-head">
      <button id="search-btn" class="nav-search" type="button" title="Search projects, agents, sessions and files (Ctrl+K) · Shift+click: grep (Ctrl+G)" aria-label="Search projects, agents, sessions and files (Ctrl+K) · Shift+click: grep (Ctrl+G)"><span class="goi-icon" aria-hidden="true"></span><span class="nav-search-label">Search</span><kbd class="nav-search-key">⌘K</kbd></button>
      <button id="nav-collapse" class="nav-icon-action" type="button" title="hide sidebar" aria-label="hide sidebar"><span class="goi-icon" aria-hidden="true"></span></button>
    </div>
    <div class="nav-section-head">
      <span class="nav-section-title">Projects</span>
      <a id="nav-board-link" class="nav-icon-action nav-board-link" data-route="agents" href="/agents" title="All agents" aria-label="All agents"><span class="goi-icon" aria-hidden="true"></span></a>
    </div>
    <div id="nav-projects" class="nav-projects"></div>
    <div class="nav-foot">
      <button id="nav-launch" class="nav-foot-item" type="button"><span class="goi-icon" aria-hidden="true"></span><span class="nav-foot-label">New agent</span></button>
      <a id="nav-settings" class="nav-foot-item" data-route="help" href="/help?section=settings"><span class="goi-icon" aria-hidden="true"></span><span class="nav-foot-label">Settings</span></a>
      <button id="quick-help-btn" class="nav-foot-item" type="button" title="quick help (shortcuts)" aria-label="quick help (shortcuts)"><span class="goi-icon" aria-hidden="true"></span><span class="nav-foot-label">Help</span></button>
    </div>
    <div id="app-nav-resizer" class="app-nav-resizer" role="separator" tabindex="0" aria-orientation="vertical" aria-label="resize sidebar"></div>
  </aside>
  <!-- 上の行は持たない: タブ列が最上段。プロジェクト名・ブランチと画面の入口
       (#view-head) は左の列の頭 (#left-head) に固定し、タブを切り替えても動かさない。
       利用者が左の列を畳んだときだけタブ列の左 (#tabs-lead) へ移す
       (views/sidebar.ts の placeSidebarToggle)。畳んだ左の列は細い帯 (#left-rail)
       になり、開くボタンだけを畳む前と同じ列の頭の右端に置く。 -->
  <div id="tabs-lead" class="tabs-lead">
    <button id="nav-expand" class="global-icon-action" type="button" title="show sidebar" aria-label="show sidebar" hidden><span class="goi-icon" aria-hidden="true"></span></button>
  </div>
  <div id="left-head" class="left-head">
    <div id="view-head" class="view-head">
      <div class="view-head-row">
        <!-- リポジトリ名 = プロジェクトの切替 (views/projects/project-switcher.ts)。 -->
        <button id="project-switcher" class="brand" type="button" aria-label="Switch project">
          <span class="title" id="project-title">repository</span>
          <span id="project-branch" class="project-branch" hidden><span class="goi-icon" aria-hidden="true"></span><span class="project-branch-name"></span></span>
        </button>
      </div>
      <!-- 画面の入口。押すとその画面のタブを開くか前面に出す (Files は本文の
           既定 = フォルダ表示)。何を見ているかはタブだけが示すので、選択の印は
           付けない。 -->
      <nav class="app-menu view-strip" aria-label="Views">
        <a class="app-menu-item view-strip-item" data-route="repo" href="/"><span class="goi-icon" aria-hidden="true"></span></a>
        <a class="app-menu-item view-strip-item" data-route="diff" href="/todif?from=HEAD&to=worktree"><span class="goi-icon" aria-hidden="true"></span></a>
        <a class="app-menu-item view-strip-item" data-route="history" href="/history"><span class="goi-icon" aria-hidden="true"></span></a>
        <a class="app-menu-item view-strip-item" data-route="worktree" href="/worktree"><span class="goi-icon" aria-hidden="true"></span></a>
        <a class="app-menu-item view-strip-item" data-route="database" href="/database"><span class="goi-icon" aria-hidden="true"></span></a>
        <a class="app-menu-item view-strip-item" data-route="journal" href="/journal"><span class="goi-icon" aria-hidden="true"></span></a>
      </nav>
    </div>
    <div id="left-rail" class="left-rail"></div>
  </div>
  <!-- メインの面のタブ列 (最上段)。中身は views/main-tabs/main-tabs-view.ts。
       ファイル・各画面を開いたまま切り替える。高さは --main-tabs-h。 -->
  <nav id="main-tabs" aria-label="Tabs"></nav>
  <header id="topbar">
    <div id="meta"></div>
    <div class="ref-pickers">
      <span data-ref-selector-mount data-ref-id="ref-from" data-placeholder="from..."></span>
      <span class="ref-dots" aria-hidden="true"><span class="goi-icon"></span></span>
      <span data-ref-selector-mount data-ref-id="ref-to" data-placeholder="to..."></span>
      <button id="ref-reset" title="reset to HEAD .. worktree" aria-label="reset to HEAD .. worktree"></button>
      <button id="reload-prom" title="reload diff (R)" aria-label="reload diff (R)"></button>
    </div>
    <div class="spacer"></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="layout">
        <button data-layout="line-by-line" class="active">unified</button>
        <button data-layout="side-by-side">split</button>
      </div>
      <button id="ignore-ws" title="ignore whitespace changes (-w)">ws</button>
      <button id="syntax-highlight" title="syntax highlighting on">syntax on</button>
      <button id="hide-tests" title="hide test files (test|spec)">no test</button>
    </div>
  </header>

  <div id="ref-popover" hidden>
    <div class="rp-quick">
      <button class="rp-chip" data-val="worktree">worktree</button>
      <button class="rp-chip" data-val="HEAD">HEAD</button>
      <button class="rp-chip" data-val="--staged">--staged</button>
    </div>
    <div class="rp-tabs" role="tablist">
      <button class="rp-tab active" data-tab="commits">Commits</button>
      <button class="rp-tab" data-tab="branches">Branches</button>
      <button class="rp-tab" data-tab="tags">Tags</button>
    </div>
    <div class="rp-search-wrap">
      <input class="rp-search" placeholder="filter…" autocomplete="off" />
    </div>
    <div class="rp-body"></div>
  </div>

  <div id="load-bar" aria-hidden="true"></div>
  <div id="banner-stack">
    <div id="watch-limit-banner" class="gdp-banner gdp-banner--warn" role="status" hidden>
      <span class="gdp-banner-copy">
        <span id="watch-limit-text"></span>
      </span>
      <button id="watch-limit-dismiss" class="gdp-banner-dismiss" type="button" aria-label="dismiss">×</button>
    </div>
    <div id="change-banner" class="gdp-banner" hidden>
      <span id="change-banner-copy" class="gdp-banner-copy">
        <span id="change-banner-text"></span>
        <span id="change-banner-age"></span>
      </span>
      <button id="change-banner-reload" type="button"></button>
      <button id="change-banner-dismiss" class="gdp-banner-dismiss" type="button" aria-label="dismiss">×</button>
    </div>
  </div>

  <aside id="history-panel" hidden></aside>
  <div id="history-resizer" aria-hidden="true"></div>
  <!-- 作業ツリー画面の一覧。中身は worktree-view が入れる。見た目は
       #history-panel と同じ規則を共有している。変更ファイルは Repository と
       同じ #sidebar、差分は #diff を使うので、増える箱はこれだけ。 -->
  <aside id="worktree-panel" hidden></aside>
  <aside id="sidebar">
    <div class="sb-head">
      <span class="sb-title">Files</span>
      <span id="totals"></span>
      <span data-ref-selector-mount data-ref-id="repo-target" data-wrapper-id="repo-target-wrap" data-extra-class="ref-selector-in-grid" data-placeholder="target..." data-title="repository target" hidden></span>
      <div class="sb-actions" role="group" aria-label="sidebar actions">
        <button id="sb-expand-all" class="sb-icon-action sb-tree-action" title="expand all folders" aria-label="expand all folders"></button>
        <button id="sb-collapse-all" class="sb-icon-action sb-tree-action" title="collapse all folders" aria-label="collapse all folders"></button>
      </div>
      <div class="seg sb-view-seg" role="group" aria-label="view">
        <button data-view="tree" class="active" title="tree view">tree</button>
        <button data-view="flat" title="flat list">flat</button>
      </div>
    </div>
    <div class="sb-filter-wrap">
      <input id="sb-filter" type="search" placeholder="filter files…  /  ⌘K" title="Use /pattern/ for regex. Press / to focus this field, Cmd/Ctrl+K for the full-file palette, Ctrl+G for grep, ? for help." autocomplete="off" />
      <button id="sb-filter-clear" type="button" class="sb-filter-clear" title="Clear file filter" aria-label="Clear file filter" hidden>Clear</button>
    </div>
    <ul id="filelist"></ul>
    <div id="sidebar-resizer" aria-hidden="true"></div>
  </aside>
  <button id="sidebar-toggle" title="hide sidebar" aria-label="hide sidebar">
    <span class="sidebar-toggle-label">Files</span>
  </button>

  <div id="quick-help-popover" hidden role="dialog" aria-label="quick help" aria-modal="false">
    <div class="quick-help-head">
      <strong id="quick-help-title">Quick Help</strong>
      <button id="quick-help-close" type="button" aria-label="close quick help">×</button>
    </div>
    <div id="quick-help-groups"></div>
    <div class="quick-help-foot">
      <a id="quick-help-settings-link" href="/help?section=settings">Settings →</a>
      <a id="quick-help-full-link" href="/help?section=keybindings">View all keybindings →</a>
    </div>
  </div>

  <aside id="annotation-panel" hidden>
    <div id="annotation-panel-resizer" aria-hidden="true"></div>
    <div class="annotation-panel-head">
      <strong>Code annotations</strong>
      <button id="annotation-add" class="gdp-btn gdp-btn-sm annotation-primary" type="button"></button>
      <button id="annotation-panel-close" class="annotation-icon-btn" type="button">Close panel</button>
    </div>
    <div class="annotation-panel-options">
      <label class="annotation-follow-label" title="jump to new annotations as they arrive">
        <input type="checkbox" id="annotation-follow" checked /> follow
      </label>
    </div>
    <div id="annotation-player" hidden>
      <button id="annotation-player-toggle" type="button" title="Play annotation playback" aria-label="Play annotation playback"></button>
      <button id="annotation-player-prev" type="button" title="Previous annotation" aria-label="Previous annotation"></button>
      <button id="annotation-player-next" type="button" title="Next annotation" aria-label="Next annotation"></button>
      <span id="annotation-player-progress"></span>
      <button id="annotation-player-mute" type="button" title="Mute annotation playback" aria-label="Mute annotation playback"></button>
      <select id="annotation-player-rate" title="Speed" aria-label="Playback speed">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </div>
    <div class="annotation-list-head">
      <strong>Sessions</strong>
      <span id="annotation-list-count"></span>
    </div>
    <div id="annotation-sessions"></div>
    <div class="annotation-library-footer"><button id="annotation-clear" type="button">Delete all notes</button></div>
    <div id="annotation-detail" hidden>
      <div class="annotation-detail-head">
        <span id="annotation-detail-session"></span>
        <span id="annotation-detail-time"></span>
        <span id="annotation-detail-step"></span>
        <button id="annotation-detail-prev" class="annotation-icon-btn" type="button" title="previous annotation" aria-label="previous annotation"></button>
        <button id="annotation-detail-next" class="annotation-icon-btn" type="button" title="next annotation" aria-label="next annotation"></button>
        <button id="annotation-detail-close" type="button">close</button>
      </div>
      <a id="annotation-detail-location" href="#"></a>
      <div id="annotation-detail-body" class="markdown-body"></div>
    </div>
  </aside>

  <aside id="query-history-panel" hidden>
    <div id="query-history-resizer" aria-hidden="true"></div>
    <div class="query-history-panel-head">
      <strong>Query History</strong>
      <button id="query-history-panel-close" type="button">close</button>
    </div>
    <div id="query-history-content"></div>
  </aside>

  <div id="doctor-sheet-overlay" class="doctor-sheet-overlay" hidden aria-hidden="true"></div>
  <aside id="doctor-sheet" class="doctor-sheet" hidden aria-hidden="true" inert aria-label="environment doctor"></aside>
  <main id="content">
    <section id="history-commit-info" hidden></section>
    <div id="empty" class="empty hidden">
      <div class="empty-icon" aria-hidden="true">
        <svg
          class="octicon octicon-git-branch"
          viewBox="0 0 16 16"
          width="16"
          height="16"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M9.5 3.25a2.25 2.25 0 1 1 3 2.122V6A2.5 2.5 0 0 1 10 8.5H6a1 1 0 0 0-1 1v1.128a2.251 2.251 0 1 1-1.5 0V5.372a2.25 2.25 0 1 1 1.5 0v1.836A2.493 2.493 0 0 1 6 7h4a1 1 0 0 0 1-1v-.628A2.25 2.25 0 0 1 9.5 3.25Zm-6 0a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Zm8.25-.75a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5ZM4.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z"
          ></path>
        </svg>
      </div>
      <h2>No changes</h2>
      <p>The working tree is clean against this ref.</p>
    </div>
    <div id="diff"></div>
    <!-- Tools と Search のタブの中身。画面に入ると #diff を隠して開く
         (app.ts の enterToolOrSearchPage)。#tools-sheet は右ドロワーだった頃の id のまま。 -->
    <aside id="tools-sheet" class="tools-sheet" hidden aria-hidden="true" inert aria-label="tools"></aside>
    <aside id="search-sheet" class="search-sheet" hidden aria-hidden="true" inert aria-label="search results"></aside>
  </main>
  <!-- 最下段: アカウントごとの使用量 (views/agents/usage-status.ts)、
       エージェントの件数 (views/agents/agent-status.ts)、サーバの状態と診断。 -->
  <footer id="statusbar">
    <div id="usage-status" class="usage-status" role="group" aria-label="Usage"></div>
    <span class="statusbar-spacer"></span>
    <!-- エージェントの件数 (入力待ち / 作業中)。中身は views/agents/agent-status.ts が入れる。 -->
    <button id="agent-status" class="agent-status" type="button" hidden></button>
    <span class="statusbar-sep" aria-hidden="true"></span>
    <span id="status" class="status" role="status" aria-live="polite"><span class="status-label"></span></span>
    <!-- 上の行の右端にあった操作 (注釈・AI 向けのコピー・自動更新・通信の中止・
         テーマ・リポジトリの Web ページ)。id はそのまま (app.ts が絵と状態を貼る)。 -->
    <div class="global-actions statusbar-actions" role="group" aria-label="Actions">
      <button id="annotations-toggle" class="global-icon-action" title="code annotations" aria-label="code annotations"><span class="goi-icon" aria-hidden="true"></span><span id="annotations-count" hidden></span></button>
      <button id="copy-ai-context" class="global-icon-action" title="Copy AI context" aria-label="Copy AI context"><span class="goi-icon" aria-hidden="true"></span></button>
      <span id="copy-ai-context-feedback" class="goi-feedback" role="status" hidden></span>
      <button id="auto-update" class="global-icon-action active" title="auto update on file change" aria-label="auto update on file change"><span class="goi-icon" aria-hidden="true"></span></button>
      <button id="cancel-requests" class="global-icon-action" title="no in-flight requests" aria-label="no in-flight requests" disabled><span class="goi-icon" aria-hidden="true"></span></button>
      <button id="theme" class="global-icon-action" title="toggle theme" aria-label="toggle theme"></button>
      <a id="repo-web-link" class="global-icon-link" href="#" target="_blank" rel="noopener" hidden><span class="goi-icon" aria-hidden="true"></span></a>
    </div>
    <button id="doctor-btn" class="statusbar-icon-action" type="button" title="environment doctor" aria-label="environment doctor"><span class="goi-icon" aria-hidden="true"></span><span id="doctor-badge" class="doctor-badge" hidden></span></button>
  </footer>
</div>

<script src="/app.js"></script>
</body>
</html>
